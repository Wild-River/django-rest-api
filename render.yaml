databases:
  - name: api-db
    plan: free
    databaseName: api_db
    user: api_db

services:
  - type: web
    name: nextjs-restapi
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn rest_api.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true